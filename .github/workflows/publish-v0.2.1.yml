name: Publish v0.2.1 after validated CI
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: honeypot-smtp-analyzer-v0.2.1
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'felipewatter/honeypot-smtp-analyzer' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build verified wheel and sdist and publish GitHub assets only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TESTED_SHA"
          test "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = '0.2.1'
          if gh release view v0.2.1 --repo "$GH_REPO" >/dev/null 2>&1; then exit 0; fi
          if git ls-remote --tags origin refs/tags/v0.2.1 | grep -q .; then echo 'Existing tag must never be reused'; exit 1; fi
          python -m pip install 'build>=1.2,<2'
          python -m build --outdir release-assets
          (cd release-assets && sha256sum *.whl *.tar.gz > SHA256SUMS)
          { echo '# honeypot-smtp-analyzer v0.2.1'; echo; echo 'Changes since v0.2.0:'; git log --format='- %s (%h)' v0.2.0..HEAD; } > release-notes.txt
          gh release create v0.2.1 release-assets/* --repo "$GH_REPO" --target "$TESTED_SHA" \
            --title 'honeypot-smtp-analyzer v0.2.1' --notes-file release-notes.txt --latest
